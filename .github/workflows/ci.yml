name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: API (pytest on PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: platform
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pytest pytest-cov
      - name: Exchange, finance and bot tests with a coverage gate
        run: python -m pytest app -q --cov=app/services --cov=app/bot/services --cov-report=term --cov-fail-under=70
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/platform
          SECRET_KEY: ci-only-secret
          BOT_ENABLED: "false"
          PYTHONPATH: .

  frontend:
    name: Web (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  docker:
    name: Docker (whole platform)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose build
      - name: Start the stack and wait for the bot to quote on the exchange
        run: |
          docker compose up -d
          for i in $(seq 1 60); do
            n=$(curl -sf localhost:8000/api/v1/market/prices | python3 -c "import sys,json; print(len(json.load(sys.stdin)))" 2>/dev/null || echo 0)
            [ "$n" -ge 5 ] && echo "bot published $n prices to the exchange" && break
            sleep 3
          done
          [ "$n" -ge 5 ]
          curl -sf localhost:8000/api/v1/bot/settings/ >/dev/null && echo "bot API up"
          curl -sf localhost:3000/login >/dev/null && echo "web app up"
      - if: failure()
        run: docker compose logs --tail=80
