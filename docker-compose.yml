# The whole platform: PostgreSQL, the API (exchange + finance + trading bot) and the web app.
#   docker compose up --build
# Web http://localhost:3000 · API docs http://localhost:8000/docs
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
      POSTGRES_DB: platform
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql://platform:platform@db:5432/platform
      SECRET_KEY: ${SECRET_KEY:-dev-only-secret-change-me}
      FRONTEND_CORS_ORIGINS: http://localhost:3000
      # Price source for the bot: mock (synthetic, offline) or yfinance (live Yahoo Finance quotes).
      # It can also be switched at runtime on the bot's Risk Control page.
      MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-mock}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  postgres_data:
